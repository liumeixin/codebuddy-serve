# 在云端构建 CodeBuddy 镜像，导出 tar.gz 供离线导入
#
# 为什么走这条路：NAS 连不上 Docker Hub（各类国内加速源也大面积失效），
# 但 GitHub 的 runner 在境外、直连毫无障碍。让它在云端构建好、打成 tar.gz，
# 下载后到 NAS 上 docker load，NAS 全程不用联网拉镜像。

name: Build CodeBuddy image → tar.gz

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build-tar.yml

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # 创建 Release 需要

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 看磁盘
        run: df -h /

      - name: 构建镜像
        run: |
          set -eux
          docker build -t codebuddy-serve:latest .
          docker images codebuddy-serve
          docker run --rm codebuddy-serve:latest codebuddy --version

      - name: 导出 tar.gz
        run: |
          set -eux
          docker save codebuddy-serve:latest | gzip -1 > codebuddy-serve-amd64.tar.gz
          ls -lh codebuddy-serve-amd64.tar.gz
          sha256sum codebuddy-serve-amd64.tar.gz > codebuddy-serve-amd64.tar.gz.sha256
          cat codebuddy-serve-amd64.tar.gz.sha256

      - name: 上传为 Artifact（7 天）
        uses: actions/upload-artifact@v4
        with:
          name: codebuddy-serve-amd64
          path: |
            codebuddy-serve-amd64.tar.gz
            codebuddy-serve-amd64.tar.gz.sha256
          retention-days: 7
          compression-level: 0

      - name: 发布到 Release（长期可下载）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          gh release delete image-latest --yes --cleanup-tag || true
          gh release create image-latest \
            codebuddy-serve-amd64.tar.gz \
            codebuddy-serve-amd64.tar.gz.sha256 \
            --title "CodeBuddy 镜像（最近一次构建）" \
            --notes "linux/amd64。用法：docker load -i codebuddy-serve-amd64.tar.gz"

      - name: 汇总
        run: |
          echo "### 下载地址" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ github.server_url }}/${{ github.repository }}/releases/download/image-latest/codebuddy-serve-amd64.tar.gz" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 校验" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat codebuddy-serve-amd64.tar.gz.sha256 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
