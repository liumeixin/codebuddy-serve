# 在云端构建 CodeBuddy 镜像，双路产出：
#   ① 推到 ghcr.io —— NAS 上 docker compose up 就能直接拉，不用手动导入
#   ② 导出 tar.gz 发到 Release —— NAS 完全没外网时的兜底
#
# 为什么走这条路：NAS 连不上 Docker Hub（国内各类加速源也大面积失效），
# 但 GitHub 的 runner 在境外、直连毫无障碍。

name: Build CodeBuddy image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build-tar.yml

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # 创建 Release
      packages: write   # 推送 ghcr.io

    env:
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 看磁盘
        run: df -h /

      - name: 构建镜像
        run: |
          set -eux
          docker build -t codebuddy-serve:latest .
          docker images codebuddy-serve
          docker run --rm codebuddy-serve:latest codebuddy --version

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送到 ghcr.io
        run: |
          set -eux
          IMG="${IMAGE,,}"          # ghcr 路径必须全小写
          SHORT="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          docker tag codebuddy-serve:latest "${IMG}:latest"
          docker tag codebuddy-serve:latest "${IMG}:${SHORT}"
          docker push "${IMG}:latest"
          docker push "${IMG}:${SHORT}"
          echo "已推送 ${IMG}:latest"

      - name: 导出 tar.gz（离线兜底）
        run: |
          set -eux
          docker save codebuddy-serve:latest | gzip -1 > codebuddy-serve-amd64.tar.gz
          ls -lh codebuddy-serve-amd64.tar.gz
          sha256sum codebuddy-serve-amd64.tar.gz > codebuddy-serve-amd64.tar.gz.sha256
          cat codebuddy-serve-amd64.tar.gz.sha256

      - name: 上传为 Artifact（7 天）
        uses: actions/upload-artifact@v4
        with:
          name: codebuddy-serve-amd64
          path: |
            codebuddy-serve-amd64.tar.gz
            codebuddy-serve-amd64.tar.gz.sha256
          retention-days: 7
          compression-level: 0

      - name: 发布到 Release（离线兜底，长期可下载）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          gh release delete image-latest --yes --cleanup-tag || true
          gh release create image-latest \
            codebuddy-serve-amd64.tar.gz \
            codebuddy-serve-amd64.tar.gz.sha256 \
            --title "CodeBuddy 镜像（最近一次构建）" \
            --notes "linux/amd64。用法：docker load -i codebuddy-serve-amd64.tar.gz"

      - name: 汇总
        run: |
          set -eux
          IMG="${IMAGE,,}"
          {
            echo "## 直接拉取（推荐）"
            echo ""
            echo '```yaml'
            echo "image: ${IMG}:latest"
            echo '```'
            echo ""
            echo '```bash'
            echo "docker pull ${IMG}:latest"
            echo '```'
            echo ""
            echo "## 离线导入（NAS 无外网时）"
            echo ""
            echo "${{ github.server_url }}/${{ github.repository }}/releases/download/image-latest/codebuddy-serve-amd64.tar.gz"
            echo ""
            echo "sha256:"
            echo '```'
            cat codebuddy-serve-amd64.tar.gz.sha256
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
